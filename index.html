<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vision Forge Studio | Project Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;padding:32px;font-family:Segoe UI,Arial,sans-serif;background:#f7f9fc;color:#071426;">
        <section style="max-width:560px;border:1px solid #dfe4eb;border-radius:8px;background:white;padding:24px;box-shadow:0 18px 50px rgba(8,27,51,.08);">
          <strong style="display:block;font-size:22px;margin-bottom:8px;">Vision Forge Studio React App</strong>
          <p style="margin:0 0 12px;color:#687386;line-height:1.6;">This React version runs through the Vite dev server. Install dependencies, then start the local server.</p>
          <code style="display:block;background:#f1f4f8;padding:12px;border-radius:8px;margin-bottom:8px;">npm.cmd install</code>
          <code style="display:block;background:#f1f4f8;padding:12px;border-radius:8px;">npm.cmd run dev</code>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
